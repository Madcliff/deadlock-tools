name: Windows standalone

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/windows.yml
      - deadlock_tools/**
      - scripts/windows_entry.py
      - scripts/smoke_windows.py
      - tests/test_bundle_compression.py
      - LICENSE

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build executable
        run: |
          python -m pip install PyInstaller==6.16.0
          python -m PyInstaller --clean --noconfirm --onefile --name DeadlockTools --paths . --collect-submodules deadlock_tools scripts/windows_entry.py
      - name: Test bundle compression
        run: python -m unittest tests.test_bundle_compression
      - name: Test executable
        run: python scripts/smoke_windows.py dist/DeadlockTools.exe
      - name: Package Windows download
        run: Compress-Archive -Path dist/DeadlockTools.exe,LICENSE -DestinationPath dist/DeadlockTools-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeadlockTools-Windows-x64
          path: dist/DeadlockTools-Windows-x64.zip
          if-no-files-found: error


  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeadlockTools-Windows-x64
          path: dist
      - name: Attach the tested Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/DeadlockTools-Windows-x64.zip --repo "$GITHUB_REPOSITORY"
